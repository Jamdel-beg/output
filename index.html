<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rod's Budget & Loan Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#fbfbfa] text-[#1c1d1f] font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // 🔑 YOUR SUPABASE CREDENTIALS CONFIGURATION
        // ==========================================
        const SUPABASE_URL = 'https://ecuziedfqgfgnaoreljb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_QsJX4xZ_QtD5x8fhvuQAog_PQeoK9rE';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Initial default mock data if table is empty
        const INITIAL_LOANS = [
            { id: 'l1', name: 'BDO Credit Card', totalAmount: 25000, monthlyPayment: 5000 },
            { id: 'l2', name: 'Home Credit', totalAmount: 12000, monthlyPayment: 3000 }
        ];

        const INITIAL_PERIODS = [
            { id: '2026-11-P1', name: 'Nov 2026 - P1 (Nov 1 - 15)', salary: 15000 }
        ];

        const INITIAL_PAYMENTS = [
            { id: 'p1', periodId: '2026-11-P1', loanId: 'l1', amount: 5000, paid: false }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [lastSavedTime, setLastSavedTime] = useState('');
            
            const [periods, setPeriods] = useState(INITIAL_PERIODS);
            const [payments, setPayments] = useState(INITIAL_PAYMENTS);
            const [loans, setLoans] = useState(INITIAL_LOANS);

            // 1. FETCH DATA FROM SUPABASE ON INITIAL LOAD
            useEffect(() => {
                const fetchData = async () => {
                    const { data, error } = await supabase
                        .from('tracker_state')
                        .select('*')
                        .eq('id', 'main_state')
                        .single();

                    if (data && !error) {
                        if (data.periods) setPeriods(data.periods);
                        if (data.payments) setPayments(data.payments);
                        if (data.loans) setLoans(data.loans);
                        if (data.updated_at) {
                            setLastSavedTime(new Date(data.updated_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
                        }
                    }
                };
                fetchData();
            }, []);

            // 2. AUTOMATICALLY SAVE TO SUPABASE ON STATE CHANGES
            useEffect(() => {
                const saveData = async () => {
                    const { error } = await supabase
                        .from('tracker_state')
                        .upsert({ id: 'main_state', payments, periods, loans, updated_at: new Date() });
                    if (!error) {
                        setLastSavedTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
                    }
                };
                saveData();
            }, [periods, payments, loans]);

            const togglePaymentStatus = (paymentId) => {
                setPayments(prev => prev.map(p => p.id === paymentId ? { ...p, paid: !p.paid } : p));
            };

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-6xl mx-auto">
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b pb-4 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold tracking-tight">Rod's Budget & Loan Tracker</h1>
                            <p className="text-sm text-gray-500">Real-time cross-device sync active via Supabase</p>
                        </div>
                        <div className="text-xs bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full border border-emerald-200 flex items-center gap-2">
                            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            {lastSavedTime ? `Synced at ${lastSavedTime}` : 'Connecting to cloud...'}
                        </div>
                    </header>

                    <nav className="flex gap-4 mb-6">
                        <button 
                            onClick={() => setActiveTab('dashboard')} 
                            className={`px-4 py-2 text-sm font-medium rounded-lg transition-colors ${activeTab === 'dashboard' ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                            Dashboard
                        </button>
                        <button 
                            onClick={() => setActiveTab('tracker')} 
                            className={`px-4 py-2 text-sm font-medium rounded-lg transition-colors ${activeTab === 'tracker' ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                            Payment Schedule
                        </button>
                    </nav>

                    <main className="bg-white rounded-xl shadow-sm border p-6">
                        {activeTab === 'dashboard' && (
                            <div>
                                <h2 className="text-lg font-semibold mb-4">Active Loans & Overview</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {loans.map(loan => (
                                        <div key={loan.id} className="p-4 border rounded-lg bg-gray-50/50">
                                            <div className="font-medium">{loan.name}</div>
                                            <div className="text-sm text-gray-500 mt-1">Total: ₱{loan.totalAmount.toLocaleString()}</div>
                                            <div className="text-sm font-semibold text-emerald-600 mt-2">Monthly: ₱{loan.monthlyPayment.toLocaleString()}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'tracker' && (
                            <div>
                                <h2 className="text-lg font-semibold mb-4">Payment Schedule & Checkboxes</h2>
                                <div className="space-y-3">
                                    {payments.map(payment => {
                                        const loan = loans.find(l => l.id === payment.loanId);
                                        return (
                                            <div key={payment.id} className="flex items-center justify-between p-3 border rounded-lg hover:bg-gray-50">
                                                <div className="flex items-center gap-3">
                                                    <input 
                                                        type="checkbox" 
                                                        checked={payment.paid} 
                                                        onChange={() => togglePaymentStatus(payment.id)}
                                                        className="w-5 h-5 accent-gray-900 rounded cursor-pointer"
                                                    />
                                                    <div>
                                                        <span className="font-medium">{loan ? loan.name : 'Unknown Loan'}</span>
                                                        <span className="text-xs text-gray-400 block">Period: {payment.periodId}</span>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <span className="font-semibold">₱{payment.amount.toLocaleString()}</span>
                                                    <span className={`block text-xs font-medium ${payment.paid ? 'text-emerald-600' : 'text-amber-600'}`}>
                                                        {payment.paid ? 'Paid' : 'Pending'}
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
